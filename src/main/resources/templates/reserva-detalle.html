<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Comprobante · CiberBus')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <p class="ok" th:if="${mensaje}" th:text="${mensaje}"></p>
    <section class="tarjeta">
        <h2>Detalle de reserva</h2>
        <p>Código: <strong th:text="${reserva.codigoReserva}"></strong></p>
        <p>Estado: <strong th:text="${reserva.estado}"></strong></p>
        <p>Fecha de reserva: <span th:text="${reserva.fechaReserva}"></span></p>
        <p>Comprador: <span th:text="${reserva.usuario.nombre + ' ' + reserva.usuario.apellido}"></span></p>
        <p>Ruta: <span th:text="${reserva.viaje.ruta.ciudadPartida.ciudad + ' → ' + reserva.viaje.ruta.ciudadLlegada.ciudad}"></span></p>
        <p>Salida: <span th:text="${reserva.viaje.fechaSalida + ' ' + reserva.viaje.horaSalida}"></span></p>
        <p>Pago: <span th:text="${reserva.metodoPago}"></span></p>
        <p>Total: <strong th:text="${'S/ ' + reserva.montoTotal}"></strong></p>
    </section>
    <section class="tarjeta">
        <h3>Pasajeros y asientos</h3>
        <table>
            <tr><th>Asiento</th><th>Piso</th><th>Pasajero</th><th>Documento</th><th>Precio</th></tr>
            <tr th:each="d : ${detalles}">
                <td th:text="${d.viajeAsiento.nroAsiento}"></td>
                <td th:text="${d.viajeAsiento.piso}"></td>
                <td th:text="${d.pasajero.nombre + ' ' + d.pasajero.apellido}"></td>
                <td th:text="${d.pasajero.nroDocumento}"></td>
                <td th:text="${'S/ ' + d.precioPagado}"></td>
            </tr>
        </table>
    </section>
    <form th:if="${reserva.estado == 'CONFIRMADA'}" th:action="@{/reserva/cancelar}" method="post"
          onsubmit="return confirm('¿Cancelar esta reserva? Los asientos quedarán libres.');">
        <input type="hidden" name="codigo" th:value="${reserva.codigoReserva}">
        <button class="btn oro" type="submit">Cancelar reserva</button>
    </form>
    <p><a class="btn" th:href="@{/}">Volver al inicio</a></p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
