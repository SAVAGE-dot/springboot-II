<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Comprobante de Reserva - CiberBus</title>
    <style>
        body { font-family: Segoe UI, Arial, sans-serif; margin: 0; background: #f4f7fa; color: #1a1a1a; }
        header { background: #1b365d; color: #fff; padding: 20px 32px; display: flex; justify-content: space-between; align-items: center; }
        header a { color: #c5a46e; text-decoration: none; font-weight: bold; }
        main { padding: 32px; max-width: 700px; margin: auto; }
        .ticket { background: #fff; padding: 32px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-top: 6px solid #1b365d; }
        .alert-success { background: #e6ffed; color: #0a0; padding: 12px; border-radius: 4px; margin-bottom: 20px; font-weight: bold; text-align: center; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .btn { display: inline-block; background: #1b365d; color: #fff; padding: 10px 20px; border-radius: 4px; text-decoration: none; font-weight: bold; margin-top: 20px; }
        .btn:hover { background: #284c82; }
    </style>
</head>
<body>
<header>
    <h1>CiberBus · Comprobante</h1>
    <div>
        <a th:href="@{/reserva/buscar}">Nueva Búsqueda</a> | 
        <a th:href="@{/reserva/mis-reservas}">Mis Reservas</a>
    </div>
</header>
<main>
    <div th:if="${mensaje}" class="alert-success" th:text="${mensaje}"></div>

    <div class="ticket">
        <h2>Detalle de Reserva</h2>
        <div class="info-row">
            <span>Código de Reserva:</span>
            <strong th:text="${reserva.codigoReserva}"></strong>
        </div>
        <div class="info-row">
            <span>Estado:</span>
            <strong th:text="${reserva.estado}" style="color: #0a0;"></strong>
        </div>
        <div class="info-row">
            <span>Fecha de Reserva:</span>
            <span th:text="${reserva.fechaReserva}"></span>
        </div>
        <div class="info-row">
            <span>Usuario Comprador:</span>
            <span th:text="${reserva.usuario.nombre + ' ' + reserva.usuario.apellido}"></span>
        </div>
        <div class="info-row">
            <span>Ruta:</span>
            <span th:text="${reserva.viaje.ruta.ciudadPartida.ciudad + ' ➔ ' + reserva.viaje.ruta.ciudadLlegada.ciudad}"></span>
        </div>
        <div class="info-row">
            <span>Salida:</span>
            <span th:text="${reserva.viaje.fechaSalida + ' ' + reserva.viaje.horaSalida}"></span>
        </div>
        <div class="info-row">
            <span>Método de Pago:</span>
            <span th:text="${reserva.metodoPago}"></span>
        </div>
        <div class="info-row">
            <span>Monto Total:</span>
            <strong th:text="${'S/ ' + reserva.montoTotal}" style="font-size: 18px; color: #1b365d;"></strong>
        </div>

        <div style="text-align: center;">
            <a class="btn" th:href="@{/reserva/buscar}">Volver al Inicio</a>
        </div>
    </div>
</main>
</body>
</html>
