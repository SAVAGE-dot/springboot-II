<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <h2>Busca tu próximo viaje</h2>
    <p class="note">Elige origen, destino y fecha. Luego seleccionas hasta 5 asientos y pasas a reservar.</p>

    <form method="get" th:action="@{/viajes/buscar}">
        <label for="origenId">Origen</label>
        <select id="origenId" name="origenId" onchange="window.location.href='/?origenId=' + this.value">
            <option value="">Seleccione un origen</option>
            <option th:each="origen : ${origenes}"
                    th:value="${origen.idCiudad}"
                    th:text="${origen.ciudad}"
                    th:selected="${origen.idCiudad == origenId}">Ciudad de origen</option>
        </select>

        <label for="rutaId">Destino</label>
        <select id="rutaId" name="rutaId" required th:disabled="${#lists.isEmpty(destinos)}">
            <option value="" th:text="${#lists.isEmpty(destinos) ? 'Seleccione primero un origen' : 'Seleccione un destino'}">Seleccione un destino</option>
            <option th:each="ruta : ${destinos}"
                    th:value="${ruta.idRuta}"
                    th:text="${ruta.ciudadLlegada.ciudad}">Ciudad de destino</option>
        </select>

        <label for="fecha">Fecha de viaje</label>
        <input id="fecha" name="fecha" type="date" required>

        <button class="btn oro" type="submit" th:disabled="${#lists.isEmpty(destinos)}">Buscar viajes</button>
    </form>

    <p class="note">Ciudades cargadas en la base: <strong th:text="${totalCiudades}">0</strong></p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
