<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">CiberBus</title>
    <style>
        body { font-family: Segoe UI, Arial, sans-serif; margin: 0; background: #f4f7fa; color: #1a1a1a; }
        header { background: #1b365d; color: #fff; padding: 28px 32px; }
        header p { margin: 6px 0 0; color: #c5a46e; }
        main { padding: 32px; max-width: 720px; }
        h2 { color: #1b365d; }
        label { display: block; font-weight: 600; margin-top: 16px; }
        select, input, button { box-sizing: border-box; font: inherit; padding: 10px; width: 100%; }
        button { background: #c5a46e; border: 0; color: #172d4d; cursor: pointer; font-weight: 700; margin-top: 20px; }
        .note { color: #5b6570; font-size: 14px; }
        footer { padding: 16px 32px; color: #5b6570; font-size: 13px; }
    </style>
</head>
<body>
<header>
    <h1>CiberBus</h1>
    <p>Curso 5484 · Lenguaje de Programación II · Spring Boot</p>
</header>
<main>
    <h2>Busca tu próximo viaje</h2>
    <p class="note">Prueba inicial de P4: origen y destinos disponibles según las rutas registradas.</p>

    <form method="get" th:action="@{/viajes/buscar}">
        <label for="origenId">Origen</label>
        <select id="origenId" name="origenId" onchange="window.location.href='/?origenId=' + this.value">
            <option value="">Seleccione un origen</option>
            <option th:each="origen : ${origenes}"
                    th:value="${origen.idCiudad}"
                    th:text="${origen.ciudad}"
                    th:selected="${origen.idCiudad == origenId}">Ciudad de origen</option>
        </select>

        <label for="rutaId">Destino</label>
        <select id="rutaId" name="rutaId" required th:disabled="${#lists.isEmpty(destinos)}">
            <option value="" th:text="${#lists.isEmpty(destinos) ? 'Seleccione primero un origen' : 'Seleccione un destino'}">Seleccione un destino</option>
            <option th:each="ruta : ${destinos}"
                    th:value="${ruta.idRuta}"
                    th:text="${ruta.ciudadLlegada.ciudad}">Ciudad de destino</option>
        </select>

        <label for="fecha">Fecha de viaje</label>
        <input id="fecha" name="fecha" type="date" required>

        <button type="submit" th:disabled="${#lists.isEmpty(destinos)}">Buscar viajes</button>
    </form>

    <p class="note">Ciudades cargadas en la base: <strong th:text="${totalCiudades}">0</strong></p>
</main>
<footer>Equipo CiberBus · no usar Servlets ni JSP en este proyecto</footer>
</body>
</html>
