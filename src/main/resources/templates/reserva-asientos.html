<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Asientos · CiberBus')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <p><a th:href="@{/reserva/buscar}">← Volver a búsqueda</a></p>
    <h2>Viaje: <span th:text="${viaje.codigoViaje}"></span></h2>
    <p>Ruta: <strong th:text="${viaje.ruta.ciudadPartida.ciudad + ' → ' + viaje.ruta.ciudadLlegada.ciudad}"></strong></p>
    <p>Fecha: <strong th:text="${viaje.fechaSalida + ' ' + viaje.horaSalida}"></strong> · Tarifa: <strong th:text="${'S/ ' + viaje.tarifa}"></strong></p>
    <form th:action="@{/reserva/checkout}" method="post">
        <input type="hidden" name="idViaje" th:value="${viaje.idViaje}">
        <section class="mapa">
            <div th:each="a : ${asientos}">
                <label th:if="${a.estado == 1}">
                    <input type="checkbox" name="asientosIds" th:value="${a.idViajeAsiento}">
                    <span class="asiento disponible" th:text="${'A' + a.nroAsiento}"></span>
                </label>
                <span th:if="${a.estado != 1}" class="asiento ocupado" th:text="${'A' + a.nroAsiento}"></span>
            </div>
        </section>
        <button class="btn oro" type="submit">Continuar con la reserva</button>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script>
document.querySelector('form').addEventListener('submit', function (event) {
  const cantidad = document.querySelectorAll('input[name="asientosIds"]:checked').length;
  if (cantidad === 0 || cantidad > 5) {
    event.preventDefault();
    alert('Seleccione entre 1 y 5 asientos.');
  }
});
</script>
</body>
</html>
