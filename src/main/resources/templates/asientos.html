<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/publico :: head('Selección de Asientos - CiberBus', 'asiento.css')}"></head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/publico :: navbar}"></header>
<main class="flex-grow-1 bg-light py-5">
    <div class="container">
        <h2 class="fw-bold mb-4" style="color: #4f699c;">Selección de asientos</h2>
        <p th:if="${rutaId != null and fecha != null}">
            <a th:href="@{/viajes/buscar(rutaId=${rutaId},fecha=${fecha})}" class="btn btn-outline-secondary px-4 mb-3">
                <i class="bi bi-arrow-left"></i> Volver a los viajes
            </a>
        </p>

        <div class="card shadow-sm border-0 rounded-4 mb-4">
            <div class="card-body p-4 bg-white rounded-4">
                <div class="row align-items-center text-center text-md-start g-3">
                    <div class="col-md-2">
                        <small class="text-secondary d-block">Código</small>
                        <strong th:text="${viaje.codigoViaje}">VIAJE</strong>
                    </div>
                    <div class="col-md-2">
                        <small class="text-secondary d-block">Servicio</small>
                        <strong th:text="${viaje.bus.tipoBus}">Bus</strong>
                    </div>
                    <div class="col-md-3">
                        <small class="text-secondary d-block">Salida</small>
                        <span class="fw-bold" th:text="${viaje.horaSalida}">08:00</span> -
                        <small th:text="${viaje.fechaSalida}">Fecha</small>
                    </div>
                    <div class="col-md-3">
                        <small class="text-secondary d-block">Llegada</small>
                        <span class="fw-bold" th:text="${viaje.horaLlegada}">18:00</span> -
                        <small th:text="${viaje.fechaLlegada}">Fecha</small>
                    </div>
                    <div class="col-md-2 text-md-end">
                        <small class="text-secondary d-block">Tarifa</small>
                        <span class="fs-5 text-success fw-bold" th:text="|S/ ${viaje.tarifa}|">S/ 0.00</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="mb-4 text-center text-md-start">
            <span class="badge bg-white text-dark border px-3 py-2 me-2 shadow-sm">Disponible</span>
            <span class="badge bg-primary px-3 py-2 me-2 shadow-sm">Seleccionado</span>
            <span class="badge bg-secondary px-3 py-2 shadow-sm">Vendido</span>
        </div>

        <form id="formAsientos" th:action="@{/viajes/resumen}" method="post">
            <input type="hidden" name="idViaje" th:value="${viaje.idViaje}">
            <input type="hidden" name="rutaId" th:value="${rutaId}">
            <input type="hidden" name="fecha" th:value="${fecha}">
            <input type="hidden" name="asientoIds" id="asientoIds">

            <div class="card shadow-sm border-0 rounded-4 mb-4">
                <div class="card-body p-4">
                    <div class="row g-3 justify-content-center">
                        <div class="col-auto" th:each="asiento : ${asientos}">
                            <button type="button" class="btn btn-secondary asiento-btn shadow-sm"
                                    th:if="${asiento.estado != 1}" disabled
                                    th:text="${asiento.nroAsiento}">1</button>
                            <button type="button"
                                    th:if="${asiento.estado == 1}"
                                    class="btn btn-outline-primary asiento-btn asiento-disponible shadow-sm"
                                    th:data-id="${asiento.idViajeAsiento}"
                                    th:data-etiqueta="|P${asiento.piso}-${asiento.nroAsiento}|"
                                    th:data-precio="${viaje.tarifa}"
                                    th:data-seleccionado="${asientosSeleccionados.contains(asiento.idViajeAsiento)}"
                                    th:text="${asiento.nroAsiento}">1</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-lg border-0 rounded-4" style="position: sticky; bottom: 20px; z-index: 1000;">
                <div class="card-body p-4">
                    <div class="row align-items-center">
                        <div class="col-md-4 mb-3 mb-md-0">
                            <small class="text-secondary d-block">Asientos seleccionados:</small>
                            <span id="textoAsientos" class="fw-bold fs-5 text-primary">Ninguno</span>
                        </div>
                        <div class="col-md-2 mb-3 mb-md-0 text-center text-md-start">
                            <small class="text-secondary d-block">Cantidad:</small>
                            <span id="textoCantidad" class="fw-bold fs-5">0</span>
                        </div>
                        <div class="col-md-3 mb-3 mb-md-0 text-center text-md-start">
                            <small class="text-secondary d-block">Total a pagar:</small>
                            <span class="fw-bold fs-4 text-success">S/ <span id="textoTotal" th:data-tarifa="${viaje.tarifa}">0.00</span></span>
                        </div>
                        <div class="col-md-3 text-center text-md-end">
                            <button type="submit" class="btn btn-warning btn-lg px-4 fw-bold w-100 shadow-sm">
                                Continuar <i class="bi bi-arrow-right-circle ms-2"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/publico :: footer}"></footer>
<th:block th:replace="~{fragments/publico :: scripts}"></th:block>
<script>
const botones = document.querySelectorAll('.asiento-disponible');
const seleccionados = Array.from(document.querySelectorAll('.asiento-disponible[data-seleccionado="true"]'))
    .map(btn => ({ id: btn.dataset.id, etiqueta: btn.dataset.etiqueta, precio: parseFloat(btn.dataset.precio) }));

seleccionados.forEach(item => {
    const btn = document.querySelector('.asiento-disponible[data-id="' + item.id + '"]');
    if (btn) {
        btn.classList.remove('btn-outline-primary');
        btn.classList.add('btn-primary', 'text-white');
    }
});

botones.forEach(btn => {
    btn.addEventListener('click', function () {
        const id = this.dataset.id;
        const etiqueta = this.dataset.etiqueta;
        const precio = parseFloat(this.dataset.precio);
        if (this.classList.contains('btn-primary')) {
            this.classList.remove('btn-primary', 'text-white');
            this.classList.add('btn-outline-primary');
            const index = seleccionados.findIndex(a => a.id === id);
            if (index !== -1) seleccionados.splice(index, 1);
        } else {
            if (seleccionados.length >= 5) {
                alert('Solo puede seleccionar un máximo de 5 asientos.');
                return;
            }
            this.classList.remove('btn-outline-primary');
            this.classList.add('btn-primary', 'text-white');
            seleccionados.push({ id, etiqueta, precio });
        }
        actualizarResumen();
    });
});

function actualizarResumen() {
    const etiquetas = seleccionados.map(a => a.etiqueta);
    const total = seleccionados.reduce((acum, a) => acum + a.precio, 0);
    document.getElementById('textoAsientos').innerText = etiquetas.length ? etiquetas.join(', ') : 'Ninguno';
    document.getElementById('textoCantidad').innerText = seleccionados.length;
    document.getElementById('textoTotal').innerText = total.toFixed(2);
    document.getElementById('asientoIds').value = seleccionados.map(a => a.id).join(',');
}

actualizarResumen();

document.getElementById('formAsientos').addEventListener('submit', function (e) {
    if (seleccionados.length === 0) {
        e.preventDefault();
        alert('Debe seleccionar al menos un asiento para continuar con la compra.');
    }
});
</script>
</body>
</html>
