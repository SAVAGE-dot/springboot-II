<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Viajes · CiberBus')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <p><a th:href="@{/admin}">← Volver al admin</a></p>
    <h2>Viajes</h2>
    <p class="note">Al crear un viaje nuevo se generan automáticamente los asientos (uno por cada asiento del bus).</p>
    <p class="ok" th:if="${ok}" th:text="${ok}"></p>
    <form th:action="@{/admin/viajes/guardar}" method="post">
        <label>Código del viaje</label>
        <input name="codigoViaje" required placeholder="CB-001">
        <label>Ruta</label>
        <select name="idRuta" required>
            <option value="">Seleccione</option>
            <option th:each="r : ${rutas}"
                    th:value="${r.idRuta}"
                    th:text="${r.ciudadPartida.ciudad + ' → ' + r.ciudadLlegada.ciudad}">Ruta</option>
        </select>
        <label>Bus</label>
        <select name="idBus" required>
            <option value="">Seleccione</option>
            <option th:each="b : ${buses}"
                    th:value="${b.idBus}"
                    th:text="${b.nroPlaca + ' · ' + b.nroAsientos + ' asientos'}">Bus</option>
        </select>
        <label>Conductor</label>
        <select name="idConductor" required>
            <option value="">Seleccione</option>
            <option th:each="c : ${conductores}"
                    th:value="${c.idConductor}"
                    th:text="${c.nombre + ' ' + c.apellido}">Conductor</option>
        </select>
        <label>Fecha de salida</label>
        <input type="date" name="fechaSalida" required>
        <label>Hora de salida</label>
        <input type="time" name="horaSalida" required>
        <label>Fecha de llegada</label>
        <input type="date" name="fechaLlegada" required>
        <label>Hora de llegada</label>
        <input type="time" name="horaLlegada" required>
        <label>Tarifa (S/)</label>
        <input type="number" step="0.01" name="tarifa" required>
        <label>Estado</label>
        <select name="estado">
            <option value="1">Activo</option>
            <option value="0">Inactivo</option>
        </select>
        <button class="btn" type="submit">Crear viaje</button>
    </form>
    <table>
        <tr><th>Código</th><th>Ruta</th><th>Salida</th><th>Bus</th><th>Tarifa</th><th>Estado</th></tr>
        <tr th:each="v : ${viajes}">
            <td th:text="${v.codigoViaje}">CB-001</td>
            <td th:text="${v.ruta.ciudadPartida.ciudad + ' → ' + v.ruta.ciudadLlegada.ciudad}">Lima → Trujillo</td>
            <td th:text="${v.fechaSalida + ' ' + v.horaSalida}">2026-09-24 22:00</td>
            <td th:text="${v.bus.nroPlaca}">ABC-123</td>
            <td th:text="${'S/ ' + v.tarifa}">S/ 80</td>
            <td th:text="${v.estado == 1 ? 'Activo' : 'Inactivo'}">Activo</td>
        </tr>
    </table>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
