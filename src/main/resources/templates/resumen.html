<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Resumen · CiberBus')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <h2>Resumen de selección</h2>
    <p class="note">Todavía no se ha creado ninguna reserva.</p>
    <p><a th:href="@{/viajes/{id}/asientos(id=${viaje.idViaje},rutaId=${rutaId},fecha=${fecha},asientoIds=${asientoIds})}">← Modificar asientos</a></p>
    <section class="tarjeta">
        <h2 th:text="${viaje.codigoViaje}">Viaje</h2>
        <p th:text="|${viaje.ruta.ciudadPartida.ciudad} → ${viaje.ruta.ciudadLlegada.ciudad}|">Ruta</p>
        <p th:text="|Salida: ${viaje.fechaSalida} ${viaje.horaSalida}|">Salida</p>
        <p th:text="|Bus: ${viaje.bus.tipoBus} · ${viaje.bus.nroAsientos} asientos|">Bus</p>
    </section>
    <section class="tarjeta">
        <h3>Asientos elegidos</h3>
        <p th:each="asiento : ${asientos}" th:text="|Piso ${asiento.piso}, asiento ${asiento.nroAsiento} · S/ ${viaje.tarifa}|">Asiento</p>
        <p th:text="|Total estimado: S/ ${total}|">Total</p>
    </section>
    <form th:action="@{/reserva/checkout}" method="post">
        <input type="hidden" name="idViaje" th:value="${viaje.idViaje}">
        <input type="hidden" name="asientosIds" th:each="asiento : ${asientos}" th:value="${asiento.idViajeAsiento}">
        <p><button class="btn" type="submit">Continuar a reserva</button></p>
    </form>
    <p><a th:if="${rutaId != null and fecha != null}" th:href="@{/viajes/buscar(rutaId=${rutaId},fecha=${fecha})}">Buscar otro viaje</a></p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
