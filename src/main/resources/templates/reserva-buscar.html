<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Buscar viajes · CiberBus')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <h2>Buscar viaje</h2>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <p class="ok" th:if="${mensaje}" th:text="${mensaje}"></p>
    <form th:action="@{/reserva/resultados}" method="get">
        <label for="origen">Origen</label>
        <select id="origen" name="origen" required>
            <option value="">Seleccione origen</option>
            <option th:each="c : ${ciudades}" th:value="${c.idCiudad}" th:text="${c.ciudad + ' (' + c.departamento + ')'}" th:selected="${c.idCiudad == origenSeleccionado}"></option>
        </select>
        <label for="destino">Destino</label>
        <select id="destino" name="destino" required>
            <option value="">Seleccione destino</option>
            <option th:each="c : ${ciudades}" th:value="${c.idCiudad}" th:text="${c.ciudad + ' (' + c.departamento + ')'}" th:selected="${c.idCiudad == destinoSeleccionado}"></option>
        </select>
        <label for="fecha">Fecha de salida</label>
        <input type="date" id="fecha" name="fecha" th:value="${fechaSeleccionada}" required>
        <button class="btn" type="submit">Buscar viajes</button>
    </form>
    <div th:if="${viajes != null and !viajes.isEmpty()}">
        <h3>Viajes disponibles</h3>
        <table>
            <tr><th>Código</th><th>Ruta</th><th>Salida</th><th>Llegada</th><th>Tarifa</th><th></th></tr>
            <tr th:each="v : ${viajes}">
                <td th:text="${v.codigoViaje}"></td>
                <td th:text="${v.ruta.ciudadPartida.ciudad + ' → ' + v.ruta.ciudadLlegada.ciudad}"></td>
                <td th:text="${v.fechaSalida + ' ' + v.horaSalida}"></td>
                <td th:text="${v.fechaLlegada + ' ' + v.horaLlegada}"></td>
                <td th:text="${'S/ ' + v.tarifa}"></td>
                <td><a class="btn oro" th:href="@{/reserva/asientos/{id}(id=${v.idViaje})}">Ver asientos</a></td>
            </tr>
        </table>
    </div>
    <p class="note" th:if="${viajes != null and viajes.isEmpty()}">No se encontraron viajes para esos datos.</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
