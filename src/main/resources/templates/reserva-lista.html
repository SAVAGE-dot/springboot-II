<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Mis reservas · CiberBus')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <h2 th:text="${'Reservas de ' + usuarioActual.nombre + ' ' + usuarioActual.apellido}">Reservas</h2>
    <p class="note">También puedes <a th:href="@{/reserva/consultar}">consultar una reserva por código</a>.</p>
    <table th:if="${reservas != null and !reservas.isEmpty()}">
        <tr><th>Código</th><th>Viaje</th><th>Fecha</th><th>Total</th><th>Estado</th><th></th></tr>
        <tr th:each="r : ${reservas}">
            <td th:text="${r.codigoReserva}"></td>
            <td th:text="${r.viaje.codigoViaje + ' (' + r.viaje.ruta.ciudadPartida.ciudad + ' → ' + r.viaje.ruta.ciudadLlegada.ciudad + ')'}"></td>
            <td th:text="${r.fechaReserva}"></td>
            <td th:text="${'S/ ' + r.montoTotal}"></td>
            <td th:text="${r.estado}"></td>
            <td><a th:href="@{/reserva/detalle/{codigo}(codigo=${r.codigoReserva})}">Ver detalle</a></td>
        </tr>
    </table>
    <p class="note" th:if="${reservas != null and reservas.isEmpty()}">No hay reservas para este usuario.</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
