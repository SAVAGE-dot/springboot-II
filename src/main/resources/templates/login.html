<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Login · CiberBus')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="login-wrap">
<div class="login-box">
    <h2>Ingresar</h2>
    <p class="note">Usa tu número de documento y tu clave.</p>
    <form th:action="@{/login}" method="post">
        <label for="nroDocumento">Nro. Documento</label>
        <input type="text" id="nroDocumento" name="nroDocumento" required autofocus>
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" required>
        <button class="btn" type="submit">Ingresar</button>
    </form>
    <p class="error" th:if="${param.error}">Usuario o contraseña incorrectos.</p>
    <p class="ok" th:if="${param.logout}">Sesión cerrada correctamente.</p>
    <p class="ok" th:if="${ok}" th:text="${ok}"></p>
    <p class="note">¿No tienes cuenta? <a th:href="@{/registro}">Registrarse</a></p>
    <p class="note">Admin de prueba: 12345678 / admin123<br>Cliente de prueba: 87654321 / cliente123</p>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
