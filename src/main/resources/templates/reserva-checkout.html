<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Confirmar reserva · CiberBus')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <h2>Confirmación de reserva</h2>
    <form th:action="@{/reserva/procesar}" method="post">
        <input type="hidden" name="idViaje" th:value="${viaje.idViaje}">
        <div th:each="a : ${asientosSeleccionados}">
            <input type="hidden" name="asientosIds" th:value="${a.idViajeAsiento}">
        </div>
        <section class="tarjeta">
            <h3>Resumen del viaje</h3>
            <p>Ruta: <strong th:text="${viaje.ruta.ciudadPartida.ciudad + ' → ' + viaje.ruta.ciudadLlegada.ciudad}"></strong></p>
            <p>Fecha y hora: <strong th:text="${viaje.fechaSalida + ' ' + viaje.horaSalida}"></strong></p>
            <p>Asientos:
                <span th:each="a, iterStat : ${asientosSeleccionados}"
                      th:text="${'A' + a.nroAsiento + (!iterStat.last ? ', ' : '')}"></span>
            </p>
            <p>Monto total: <strong th:text="${'S/ ' + (viaje.tarifa * asientosSeleccionados.size())}"></strong></p>
        </section>
        <section class="tarjeta">
            <h3>Comprador</h3>
            <p>
                <strong th:text="${usuarioActual.nombre + ' ' + usuarioActual.apellido}">Invitado</strong>
                <span th:if="${usuarioActual.nroDocumento == 'GUEST'}"> (invitado, sin sesión)</span>
            </p>
        </section>
        <section class="tarjeta" th:each="a : ${asientosSeleccionados}">
            <h3 th:text="${'Pasajero del asiento A' + a.nroAsiento + ' (piso ' + a.piso + ')'}">Pasajero</h3>
            <label>Tipo de documento</label>
            <select name="tipoDocumento" required>
                <option value="DNI">DNI</option>
                <option value="Pasaporte">Pasaporte</option>
            </select>
            <label>Nro. documento</label>
            <input type="text" name="nroDocumento" required>
            <label>Nombre</label>
            <input type="text" name="nombre" required>
            <label>Apellido</label>
            <input type="text" name="apellido" required>
            <label>Correo</label>
            <input type="email" name="correo">
            <label>Teléfono</label>
            <input type="text" name="telefono">
        </section>
        <section class="tarjeta">
            <h3>Método de pago (simulado)</h3>
            <label>Método</label>
            <select name="metodoPago" required>
                <option value="TARJETA_CREDITO">Tarjeta de crédito / débito</option>
                <option value="YAPE_PLIN">Yape / Plin</option>
                <option value="EFECTIVO">Efectivo en counter</option>
            </select>
            <button class="btn" type="submit">Confirmar y pagar</button>
        </section>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
